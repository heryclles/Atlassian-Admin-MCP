[project]
name = "atlassian-mcp-for-admins"
version = "0.9.0"
description = "Atlassian MCP for Admins: ferramentas administrativas para Jira Cloud, JSM e Jira Forms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
atlassian-mcp-for-admins = "atlassian_mcp_for_admins.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_mcp_for_admins"]
